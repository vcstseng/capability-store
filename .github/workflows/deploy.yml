name: Deploy Layer 1 to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'data/processed/catalog/**', 'config/taxonomy/portal-navigation.json', 'config/resource-display.json', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/tests/*.test.mjs
      - run: node web/scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
